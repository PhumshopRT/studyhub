<html lang="th" data-theme="dark">
<head>

<title>RadLibrary · คลังสรุป & ห้องจำลองฟิสิกส์รังสี</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-thai@latest/thai-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-thai@latest/thai-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-thai@latest/thai-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-thai@latest/thai-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-thai@latest/thai-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-thai@latest/thai-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-600-normal.css">
<style>
:root{--font-body:"Noto Sans Thai",system-ui,sans-serif;--font-head:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;
 --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;--c1:#3fd6e8;--c2:#f6b45c;--c3:#a78bfa;--ok:#43dd8c;--bad:#fb7185;--ease:cubic-bezier(.22,.9,.3,1);}
[data-theme="dark"]{--bg:#070b15;--bg-soft:#0b1120;--bg-deep:#04070e;--surf:rgba(255,255,255,.045);--surf-2:rgba(255,255,255,.075);--surf-3:rgba(255,255,255,.11);
 --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);--ink:#eaf1fc;--ink-2:#a7b4cf;--ink-3:#6d7c9c;
 --shadow-1:0 2px 10px rgba(0,0,0,.35);--shadow-2:0 18px 50px -12px rgba(0,0,0,.6);--code-bg:rgba(63,214,232,.08);--scrim:rgba(3,6,12,.66);}
[data-theme="light"]{--bg:#eef2f9;--bg-soft:#f7f9fd;--bg-deep:#e4eaf4;--surf:rgba(255,255,255,.82);--surf-2:rgba(255,255,255,.95);--surf-3:#fff;
 --line:rgba(15,30,60,.10);--line-2:rgba(15,30,60,.18);--ink:#0d1526;--ink-2:#41506e;--ink-3:#71809c;--c1:#0e93ab;--c2:#c07417;--c3:#7c5cd6;--ok:#159a58;--bad:#dc3d55;
 --shadow-1:0 2px 8px rgba(30,45,90,.08);--shadow-2:0 20px 44px -14px rgba(30,45,90,.22);--code-bg:rgba(14,147,171,.08);--scrim:rgba(20,28,46,.45);}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(1100px 520px at 88% -12%,color-mix(in srgb,var(--c1) 12%,transparent),transparent 62%),radial-gradient(900px 460px at -8% 4%,color-mix(in srgb,var(--c3) 10%,transparent),transparent 58%),radial-gradient(700px 400px at 50% 110%,color-mix(in srgb,var(--c2) 7%,transparent),transparent 60%);background-attachment:fixed;}
h1,h2,h3,h4,h5{font-family:var(--font-head);letter-spacing:-.01em}.mono,code{font-family:var(--font-mono)}
::selection{background:color-mix(in srgb,var(--c1) 35%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}:focus-visible{outline:2px solid var(--c1);outline-offset:2px;border-radius:6px}
.en{font-family:var(--font-mono);color:var(--c1);font-weight:500}
.shell{display:flex;min-height:100vh}
.side{width:326px;flex:0 0 326px;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;background:color-mix(in srgb,var(--bg-soft) 88%,transparent);backdrop-filter:blur(20px);border-right:1px solid var(--line);padding:20px 14px 46px;z-index:50}
.stage{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,34px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
#view{padding:clamp(20px,3.4vw,44px) clamp(14px,3.4vw,44px) 110px;width:100%;max-width:1460px;margin:0 auto}
@media(max-width:1080px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-104%);transition:transform .34s var(--ease);box-shadow:var(--shadow-2)}.side.open{transform:none}
 .scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:45;opacity:0;pointer-events:none;transition:.3s}.scrim.on{opacity:1;pointer-events:auto}.burger{display:inline-flex!important}}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 18px}
.brand__logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:0 0 46px;background:linear-gradient(140deg,var(--c1),#2f6df0 70%,var(--c3));box-shadow:0 8px 24px -6px color-mix(in srgb,var(--c1) 55%,transparent)}
.brand__t{font-weight:700;font-size:18.5px;line-height:1.2}.brand__s{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.side__label{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:18px 8px 9px}
.side__label::after{content:"";flex:1;height:1px;background:var(--line)}
.course{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surf);overflow:hidden;margin-bottom:10px;transition:.25s var(--ease)}
.course:hover{border-color:var(--line-2)}
.course__h{display:flex;gap:10px;align-items:center;width:100%;padding:12px;background:none;border:none;color:var(--ink);cursor:pointer;text-align:left}
.course__code{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--c1);background:color-mix(in srgb,var(--c1) 13%,transparent);border:1px solid color-mix(in srgb,var(--c1) 32%,transparent);padding:3px 8px;border-radius:8px;white-space:nowrap}
.course__name{font-size:12.8px;font-weight:600;line-height:1.45;color:var(--ink-2)}
.file{border-top:1px solid var(--line)}
.file__h{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px 10px 14px;background:none;border:none;color:var(--ink-2);font-size:12.8px;cursor:pointer;text-align:left;transition:.18s}
.file__h:hover{background:var(--surf-2);color:var(--ink)}.file__h.on{color:var(--c1);font-weight:600;background:color-mix(in srgb,var(--c1) 8%,transparent)}
.file__ico{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--surf-2)}
.file__ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file__tag{font-size:9.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.file__del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px;opacity:.7}
.chs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}.chs.open{grid-template-rows:1fr}.chs>div{overflow:hidden}
.ch{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 10px 7px 26px;background:none;border:none;color:var(--ink-2);font-size:12.4px;cursor:pointer;text-align:left;position:relative;transition:.16s;line-height:1.55}
.ch:hover{color:var(--ink);background:var(--surf-2)}.ch.on{color:var(--c1);font-weight:600}
.ch.on::before{content:"";position:absolute;left:12px;top:16px;width:5px;height:5px;border-radius:99px;background:var(--c1);box-shadow:0 0 8px var(--c1)}
.ch__n{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:22px;flex:0 0 22px;padding-top:2px}.ch.on .ch__n{color:var(--c1)}
.ch__en{display:block;font-family:var(--font-mono);font-size:9.6px;color:var(--ink-3);opacity:.85}.ch.on .ch__en{color:var(--c1);opacity:.7}
.ch__star{margin-left:auto;font-size:10px;color:var(--c2);padding-top:2px}
.side__btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-bottom:7px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surf);color:var(--ink-2);font-size:13.2px;cursor:pointer;text-align:left;transition:.2s var(--ease)}
.side__btn:hover{color:var(--ink);border-color:var(--line-2);transform:translateX(3px)}
.side__btn.on{border-color:color-mix(in srgb,var(--c1) 50%,transparent);background:color-mix(in srgb,var(--c1) 10%,transparent);color:var(--c1);font-weight:600}
.side__btn .n{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.side__btn .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--surf-2)}
.burger{display:none}
.tabs{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.tab{padding:7px 15px;border-radius:10px;border:none;background:none;color:var(--ink-2);font-size:12.8px;font-weight:500;cursor:pointer;transition:.2s var(--ease);white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{background:linear-gradient(135deg,var(--c1),#2f7ff0);color:#04121c;font-weight:700}
[data-theme="light"] .tab.on{color:#fff}
.crumb{flex:1;min-width:0;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crumb b{color:var(--ink-2);font-weight:600}.crumb .sep{margin:0 6px;opacity:.5}
.search{position:relative}.search input{width:230px;padding:9px 13px 9px 36px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:12.8px;outline:none;transition:.2s}
.search input:focus{border-color:color-mix(in srgb,var(--c1) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 14%,transparent)}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;font-size:12px;color:var(--ink-3);pointer-events:none}
.sres{position:absolute;top:46px;right:0;width:380px;max-height:400px;overflow:auto;background:var(--surf-3);backdrop-filter:blur(20px);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow-2);display:none;z-index:70}
.sres.on{display:block}.sres button{display:block;width:100%;text-align:left;padding:10px 15px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--ink-2);font:inherit;font-size:12.6px;cursor:pointer}
.sres button:hover{background:var(--surf-2);color:var(--c1)}.sres button:last-child{border-bottom:none}
.sres .k{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sres .e{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.icon{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--ink-2);cursor:pointer;font-size:14px;transition:.2s}
.icon:hover{color:var(--c1);border-color:color-mix(in srgb,var(--c1) 50%,transparent);transform:translateY(-1px)}
.ring{position:relative;width:38px;height:38px;flex:0 0 38px}.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--c1)}
@media(max-width:860px){.search input{width:150px}.crumb{display:none}}
@media(max-width:640px){.tabs .tab{padding:7px 10px;font-size:11.5px}.search{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 17px;border-radius:12px;border:1px solid var(--line-2);background:var(--surf-2);color:var(--ink);font-size:13.2px;font-weight:500;cursor:pointer;transition:.22s var(--ease)}
.btn:hover{transform:translateY(-1px);border-color:var(--c1);color:var(--c1);box-shadow:var(--shadow-1)}.btn:active{transform:translateY(0)}
.btn--p{background:linear-gradient(135deg,var(--c1),#2f7ff0);border:none;color:#04121c;font-weight:700;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--c1) 70%,transparent)}
.btn--p:hover{color:#04121c;filter:brightness(1.12)}[data-theme="light"] .btn--p{color:#fff}
.btn--g{background:transparent}.btn--sm{padding:6px 12px;font-size:12px;border-radius:10px}.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(14px);box-shadow:var(--shadow-1);transition:.3s var(--ease)}
.card:hover{border-color:var(--line-2)}.card--lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.card__h{display:flex;align-items:center;gap:11px;padding:15px 20px;border-bottom:1px solid var(--line)}.card__h h3{font-size:15px;font-weight:600}.card__h .hint{margin-left:auto;font-size:11px;color:var(--ink-3)}
.card__b{padding:20px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1);border:1px solid color-mix(in srgb,var(--c1) 34%,transparent)}
.badge--a{background:color-mix(in srgb,var(--c2) 13%,transparent);color:var(--c2);border-color:color-mix(in srgb,var(--c2) 36%,transparent)}
.badge--v{background:color-mix(in srgb,var(--c3) 13%,transparent);color:var(--c3);border-color:color-mix(in srgb,var(--c3) 36%,transparent)}
.badge--ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 36%,transparent)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surf);color:var(--ink-2);font-size:12.2px;cursor:pointer;transition:.18s var(--ease)}
.chip:hover{border-color:var(--c1);color:var(--c1);transform:translateY(-1px)}.chip.on{background:var(--c1);border-color:var(--c1);color:#04121c;font-weight:700}
[data-theme="light"] .chip.on{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surf-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c1);opacity:.7}
.kpi--a::after{background:var(--c2)}.kpi--v::after{background:var(--c3)}.kpi--ok::after{background:var(--ok)}.kpi--bad::after{background:var(--bad)}
.kpi__l{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.kpi__v{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--c1);word-break:break-word;line-height:1.35}
.kpi--a .kpi__v{color:var(--c2)}.kpi--v .kpi__v{color:var(--c3)}.kpi--ok .kpi__v{color:var(--ok)}.kpi--bad .kpi__v{color:var(--bad)}
.field{margin-bottom:15px}.field__top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.field__l{font-size:12.2px;color:var(--ink-2)}
.field__v{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--c1);background:var(--code-bg);padding:2px 9px;border-radius:7px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:7px;border-radius:99px;outline:none;background:linear-gradient(90deg,var(--c1) var(--fill,0%),var(--surf-3) var(--fill,0%));border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:99px;background:var(--surf-3);border:2.5px solid var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 18%,transparent),0 2px 8px rgba(0,0,0,.3);cursor:grab}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:99px;background:var(--surf-3);border:2.5px solid var(--c1);cursor:grab}
input[type=number],input[type=text],select{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surf-2);color:var(--ink);font:inherit;font-size:13px;outline:none;transition:.2s}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 14%,transparent)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.cv{width:100%;display:block;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}[data-theme="light"] .cv{background:#fff}
.bar{height:10px;border-radius:99px;background:var(--surf-3);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .4s var(--ease)}.bar--thin{height:7px}
.gauge{position:relative;height:26px;border-radius:99px;background:var(--surf-3);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.gauge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ok),var(--c2) 62%,var(--bad));transition:width .4s var(--ease)}
.gauge .lim{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.45)}
.step{border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:var(--r-sm);background:var(--surf-2);padding:12px 16px;margin:10px 0;font-size:13.4px}
.step__t{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.step code{color:var(--c1);font-weight:600;font-size:13px}
.ladder{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.ladder span{font-family:var(--font-mono);font-size:10.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);color:var(--ink-3);background:var(--surf-2);transition:.2s}
.ladder span.from{border-color:var(--c1);color:var(--c1);background:color-mix(in srgb,var(--c1) 12%,transparent);font-weight:700;transform:translateY(-2px)}
.ladder span.to{border-color:var(--c2);color:var(--c2);background:color-mix(in srgb,var(--c2) 12%,transparent);font-weight:700;transform:translateY(-2px)}
.orgrow{display:grid;grid-template-columns:148px 1fr 74px 52px;gap:10px;align-items:center;padding:5px 0;font-size:12.4px}
@media(max-width:680px){.orgrow{grid-template-columns:104px 1fr 62px}}
.orgrow .nm{color:var(--ink-2)}.orgrow .wt{font-family:var(--font-mono);color:var(--c3);font-size:11px;text-align:right}.orgrow .hv{font-family:var(--font-mono);color:var(--c1);font-size:11px;text-align:right}
.readwrap{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:30px;align-items:start}
@media(max-width:1279px){.readwrap{grid-template-columns:1fr}.rail{display:none}}
.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.rail .card{padding:16px 17px}.rail h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.rail ul{list-style:none}.rail li{font-size:12.2px;color:var(--ink-2);padding:5px 0 5px 16px;position:relative;line-height:1.6}

/* md parser */
function mdInline(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>");}
function mdBlock(lines){var out=[],list=null,para=[],tbl=null;
 function fP(){if(para.length){out.push("<p>"+mdInline(para.join(" "))+"</p>");para=[];}}
 function fL(){if(list){out.push("<ul>"+list.map(function(i){return "<li>"+mdInline(i)+"</li>";}).join("")+"</ul>");list=null;}}
 function fT(){if(tbl){out.push(TBL(tbl[0],tbl.slice(1)));tbl=null;}}
 lines.forEach(function(raw){var ln=raw.trim();
  if(!ln){fP();fL();fT();return;}
  if(/^\|/.test(ln)){fP();fL();var cells=ln.split("|").slice(1,-1).map(function(c){return c.trim();});if(cells.every(function(c){return /^:?-{2,}:?$/.test(c);}))return;if(!tbl)tbl=[];tbl.push(cells);return;}
  fT();var h=ln.match(/^(#{2,4})\s+(.*)/);
  if(h){fP();fL();var lv=h[1].length;out.push("<h"+lv+">"+mdInline(h[2])+"</h"+lv+">");return;}
  var li=ln.match(/^[-*•]\s+(.*)/);if(li){fP();if(!list)list=[];list.push(li[1]);return;}
  fL();para.push(ln);});
 fP();fL();fT();return out.join("");}
function parseMdToChapters(text){var lines=text.split(/\r?\n/),chs=[],cur=null,buf=[];
 function flush(){if(cur){cur.html=mdBlock(buf)||"<p>(ไม่มีเนื้อหา)</p>";chs.push(cur);buf=[];}}
 lines.forEach(function(ln){var h1=ln.match(/^#\s+(.*)/),h2=ln.match(/^##\s+(.*)/),hn=ln.match(/^(\d{1,2})\.\s+\S(.*)$/);
  if(h1||h2){flush();cur={id:"u"+chs.length+Math.random().toString(36).slice(2,6),num:String(chs.length+1).padStart(2,"0"),t:(h1||h2)[1],en:"uploaded file",keys:[],forms:[],sims:[],html:""};return;}
  if(hn&&(!cur||buf.length===0)){flush();cur={id:"u"+chs.length+Math.random().toString(36).slice(2,6),num:String(chs.length+1).padStart(2,"0"),t:hn[0],en:"uploaded file",keys:[],forms:[],sims:[],html:""};return;}
  buf.push(ln);});
 flush();if(!chs.length)chs.push({id:"u0",num:"01",t:"เนื้อหาทั้งหมด",en:"",keys:[],forms:[],sims:[],html:mdBlock(lines)});return chs;}

 init:function(root){var ENS=[["Co-60 (1.25 MeV)",0.065,0.5],["6 MV",0.042,1.5],["18 MV",0.030,3.2]],ei=1;var chips=$("#kmEn",root);

 html:function(){return '<div class="simgrid"><div class="card"><div class="card__h"><h3>🔗 กราฟห่วงโซ่ A→B→C</h3><span class="hint">เส้นประ = t₁, t₃, t₄</span></div><div class="card__b"><canvas id="cnCv" class="cv" style="height:300px"></canvas>'+

 '<div class="btnrow"><button class="btn btn--sm" data-cnp="sec">Secular (Ra/Rn)</button><button class="btn btn--sm" data-cnp="tra">Transient (Te/I)</button><button class="btn btn--sm" data-cnp="mo">Mo/Tc</button><button class="btn btn--sm" data-cnp="no">No equil.</button></div>'+
 '<div class="step"><div class="step__t">อัตราส่วนที่สมดุล</div><div id="cnRatio"></div></div>'+
 '<div class="step"><div class="step__t">สายสลาย Ra-226 (secular)</div><div style="font-size:11.5px;line-height:1.9;color:var(--ink-2)">Ra-226 (1600 y) →α→ Rn-222 (3.82 d) →α→ Po-218 (3.05 m) →β→ Pb-214 (26.8 m) →β→ Bi-214 (19.7 m) →α→ Po-214 (0.16 ms) →β→ Pb-210 (22 y) →β→ Bi-210 (5.0 d) →α→ Po-210 (138 d) → <b>Pb-206 (stable)</b></div></div>'+
 CO("i","💡 ที่ t₃","ความชันกราฟ N₂ = 0 ⇒ λ₁N₁ = λ₂N₂ (กัมมันตภาพ A = B)")+"</div></div></div>";},
 init:function(root){
  function calc(){var T1=unitSec(parseFloat($("#cnT1i",root).value)||1,$("#cnU1",root).value),T2=unitSec(parseFloat($("#cnT2i",root).value)||1,$("#cnU2",root).value);
   var l1=Math.LN2/T1,l2=Math.LN2/T2;
   function N1(t){return Math.exp(-l1*t);}
   function N2(t){return Math.abs(l2-l1)<1e-12?l1*t*Math.exp(-l1*t):(l1/(l2-l1))*(Math.exp(-l1*t)-Math.exp(-l2*t));}
   function N3(t){return Math.abs(l2-l1)<1e-12?1-Math.exp(-l1*t)-l1*t*Math.exp(-l1*t):1+(l1/(l2-l1))*Math.exp(-l2*t)-(l2/(l2-l1))*Math.exp(-l1*t);}
   var tMax=8*Math.max(T1,T2)*0.9;var t1=0,t3=0,t4=0;
   for(var t=0;t<tMax;t+=tMax/2000){if(!t1&&N1(t)<=N2(t))t1=t;if(!t3||N2(t)>N2(t3))t3=t;if(!t4&&t>t3&&N2(t)<=N3(t))t4=t;}
   var eq=T1>100*T2?"Secular":T1>T2?"Transient":"No equilibrium";
   $("#cnT1",root).textContent=t1?fmtT(t1):"–";$("#cnT3",root).textContent=fmtT(t3);$("#cnT4",root).textContent=t4?fmtT(t4):"–";$("#cnEq",root).textContent=eq;
   $("#cnRatio",root).innerHTML=eq==="Secular"?"<code>λ₁N₁ = λ₂N₂ (A ลูก = A แม่)</code>":eq==="Transient"?"<code>A₁/A₂ = (λ₂−λ₁)/λ₂ = "+fx((l2-l1)/l2,3)+"</code>":"<code>ไม่เป็นสมดุล — B ลดหายก่อน A</code>";
   var a=setupCv($("#cnCv",root)),g=a[0],W=a[1],H=a[2];g.clearRect(0,0,W,H);
   var mut=cssv("--ink-3");g.strokeStyle=mut;g.globalAlpha=.4;g.beginPath();g.moveTo(40,10);g.lineTo(40,H-26);g.lineTo(W-10,H-26);g.stroke();g.globalAlpha=1;
   function X(tt){return 40+(tt/tMax)*(W-52);}function Y(v){return (H-26)-v*(H-42);}
   var fs=[N1,N2,N3],cols=[cssv("--c1"),cssv("--c2"),cssv("--ok")],labs=["A (N₁)","B (N₂)","C (N₃)"];
   fs.forEach(function(f,i){g.strokeStyle=cols[i];g.lineWidth=2.4;g.beginPath();
    for(var k=0;k<=200;k++){var tt=tMax*k/200,v=Math.min(1,f(tt));if(k)g.lineTo(X(tt),Y(v));else g.moveTo(X(tt),Y(v));}g.stroke();
    g.fillStyle=cols[i];g.font="10px JetBrains Mono";g.fillText(labs[i],W-80,20+i*13);});
   [[t1,"t₁"],[t3,"t₃"],[t4,"t₄"]].forEach(function(m){if(!m[0])return;g.strokeStyle=mut;g.setLineDash([4,4]);g.globalAlpha=.7;g.beginPath();g.moveTo(X(m[0]),10);g.lineTo(X(m[0]),H-26);g.stroke();g.setLineDash([]);g.globalAlpha=1;g.fillStyle=mut;g.fillText(m[1],X(m[0])-6,H-10);});}
  ["cnT1i","cnT2i"].forEach(function(id){$("#"+id,root).addEventListener("input",calc);});

  $$("[data-cnp]",root).forEach(function(b){b.onclick=function(){var k=b.dataset.cnp;

   if(k==="tra"){$("#cnT1i",root).value=78;$("#cnU1",root).value="h";$("#cnT2i",root).value=2.3;$("#cnU2",root).value="h";}
   if(k==="mo"){$("#cnT1i",root).value=66;$("#cnU1",root).value="h";$("#cnT2i",root).value=6.02;$("#cnU2",root).value="h";}
   if(k==="no"){$("#cnT1i",root).value=6;$("#cnU1",root).value="h";$("#cnT2i",root).value=66;$("#cnU2",root).value="h";}
   calc();};});

function course(){var c=LIB.courses.filter(function(x){return x.id===state.courseId;})[0];return c||LIB.courses[0];}
function fileOf(cid,fid){var c=LIB.courses.filter(function(x){return x.id===cid;})[0]||LIB.courses[0];return c.files.filter(function(f){return f.id===fid;})[0];}
function file(){return fileOf(state.courseId,state.fileId)||course().files[0];}
function readPct(){var tot=0,n=0;LIB.courses.forEach(function(c){c.files.forEach(function(f){if(f.kind==="md")f.chapters.forEach(function(ch){tot++;if(META.read[ch.id])n++;});});});return {n:n,tot:tot,p:tot?Math.round(100*n/tot):0};}

  box.innerHTML='<div style="text-align:center;padding:16px 0 8px"><div style="font-size:58px">'+(pct>=80?"🏆":pct>=60?"🎉":"📖")+'</div><h2 style="font-size:27px;margin:10px 0 4px">ได้ '+score+" / "+pool.length+" ("+pct+'%)</h2><p style="color:var(--ink-3)">'+(pct>=80?"ยอดเยี่ยม! พร้อมสอบ":pct>=60?"ดีเลย ทบทวนอีกนิด":"กลับไปอ่านสรุปแล้วลองใหม่")+'</p><div class="gauge" style="max-width:440px;margin:20px auto"><i style="width:'+pct+'%"></i><span class="lbl">'+pct+"%</span></div></div>"+
  '<h4 style="margin:22px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">ผลรายหัวข้อ</h4>'+
  Object.keys(byT).map(function(t){var v=byT[t];return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:12.6px"><span style="color:var(--ink-2)">'+t+'</span><b class="mono">'+v[0]+"/"+v[1]+'</b></div><div class="bar bar--thin"><i style="width:'+(100*v[0]/v[1])+"%;"+(v[0]===v[1]?"background:var(--ok)":"")+'"></i></div></div>';}).join("")+
  '<div class="btnrow" style="justify-content:center;margin-top:22px"><button class="btn btn--p" id="qRe">↺ ทำใหม่</button><button class="btn" data-nav="home">📖 กลับไปอ่านสรุป</button></div>';
  $("#qRe",box).onclick=initQuiz;}
 drawQ();}
function viewFormulas(){crumb("<b>ตารางสูตร Formulas & Units</b>");
 return '<div class="card rv"><div class="card__h"><h3>🧾 ตารางสูตร ปริมาณ และหน่วย</h3><span class="hint">'+FORMULAS.length+' รายการ</span></div><div class="card__b">'+
 '<div class="field"><div class="field__top"><span class="field__l">กรองตามคอร์ส</span></div><select id="fxC"><option value="all">ทั้งหมด</option><option value="rt2568">2568 RT · Radiation Quantities</option><option value="rt2569">2569 RT · Radioactivity</option></select></div>'+
 '<div class="field"><input type="text" id="fxSearch" placeholder="🔍 กรองสูตร เช่น kerma, Q, Bateman…"></div>'+
 '<div class="tbl"><table id="fxTable"><thead><tr><th>คอร์ส</th><th>ปริมาณ</th><th>สัญลักษณ์</th><th>สูตร</th><th>หน่วย SI</th><th>หน่วยพิเศษ</th><th>หมายเหตุ</th></tr></thead><tbody>'+
 FORMULAS.map(function(r){return '<tr data-c="'+r[0]+'"><td><span class="course__code">'+(r[0]==="rt2568"?"2568":"2569")+"</span></td>"+r.slice(1).map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+
 "</tbody></table></div></div></div>";}
function initFormulas(){function filt(){var c=$("#fxC").value,q=($("#fxSearch").value||"").toLowerCase();
  $$("#fxTable tbody tr").forEach(function(tr){var ok=(c==="all"||tr.dataset.c===c)&&tr.textContent.toLowerCase().indexOf(q)>=0;tr.style.display=ok?"":"none";});}
 $("#fxC").onchange=filt;$("#fxSearch").oninput=filt;filt();}
function bindSearch(){var inp=$("#searchBox"),box=$("#sres");if(!inp||!box)return;
 inp.addEventListener("input",function(){var q=inp.value.trim().toLowerCase();
  if(!q){box.classList.remove("on");box.innerHTML="";return;}
  var out=[];
  LIB.courses.forEach(function(c){c.files.forEach(function(f){f.chapters.forEach(function(ch){
   var hay=(ch.t+" "+(ch.en||"")+" "+(ch.keys||[]).join(" ")+" "+ch.html).toLowerCase();
   if(hay.indexOf(q)>=0)out.push({k:"📖 "+c.code+" · "+f.tag,t:ch.t,e:ch.en||"",fn:function(){state.courseId=c.id;state.fileId=f.id;state.chapterId=ch.id;state.openFiles[f.id]=true;state.view="read";render();}});});});});
  Object.keys(SIMS).forEach(function(id){var s=SIMS[id];if((s.title+(s.en||"")+s.desc+s.tag).toLowerCase().indexOf(q)>=0)out.push({k:"🧪 ห้องจำลอง",t:s.title,e:s.en||"",fn:function(){state.simId=id;state.view="sim";render();}});});
  FORMULAS.forEach(function(r){if(r.join(" ").toLowerCase().indexOf(q)>=0)out.push({k:"🧾 สูตร",t:r[1]+" — "+r[3],e:r[6],fn:function(){state.view="formulas";render();}});});
  QUIZ.forEach(function(qq){if(qq.q.toLowerCase().indexOf(q)>=0)out.push({k:"📝 ข้อสอบ · "+qq.t,t:qq.q.slice(0,60)+"…",e:"",fn:function(){state.quizSet=qq.c;state.view="quiz";render();}});});
  box.innerHTML=out.length?out.slice(0,12).map(function(o,i){return '<button data-si="'+i+'"><span class="k">'+o.k+"</span>"+o.t+(o.e?'<span class="e">'+o.e+"</span>":"")+"</button>";}).join(""):"<button>ไม่พบผลลัพธ์</button>";
  box.classList.add("on");box._out=out;
  $$("button",box).forEach(function(b){b.onclick=function(){var o=box._out[+b.dataset.si];if(o){o.fn();box.classList.remove("on");inp.value="";}};});});}
/* global events */
document.addEventListener("click",function(e){
 var el;
 if((el=e.target.closest("[data-fig]"))){var lb=document.createElement("div");lb.className="lightbox";lb.innerHTML='<img src="'+el.dataset.fig+'" alt="">';lb.onclick=function(){lb.remove();};document.body.appendChild(lb);return;}
 if((el=e.target.closest("[data-copy]"))){if(navigator.clipboard)navigator.clipboard.writeText(el.dataset.copy);toast("⧉ คัดลอกสูตรแล้ว");return;}
 if((el=e.target.closest("[data-del]"))){e.stopPropagation();var fid=el.dataset.del;LIB.courses.forEach(function(c){c.files=c.files.filter(function(f){return f.id!==fid;});});persistUploads();render();toast("🗑 ลบไฟล์แล้ว");return;}
 if((el=e.target.closest("[data-ch]"))){state.courseId=el.dataset.course;state.fileId=el.dataset.file;state.chapterId=el.dataset.ch;state.openFiles[state.fileId]=true;state.view="read";closeSide();render();return;}
 if((el=e.target.closest("[data-file]"))){state.courseId=el.dataset.course;state.fileId=el.dataset.file;var f=fileOf(state.courseId,state.fileId);
  state.openFiles[state.fileId]=!state.openFiles[state.fileId];
  if(state.view!=="read"&&f&&f.chapters&&f.chapters.length){state.chapterId=f.chapters[0].id;state.view="read";}
  closeSide();render();return;}
 if((el=e.target.closest("[data-openfile]"))){state.courseId=el.dataset.opencourse;state.fileId=el.dataset.openfile;state.openFiles[state.fileId]=true;var f2=fileOf(state.courseId,state.fileId);if(f2&&f2.chapters.length)state.chapterId=f2.chapters[0].id;state.view="read";render();return;}
 if((el=e.target.closest("[data-gofile]"))){state.fileId=el.dataset.gofile;state.openFiles[state.fileId]=true;if(el.dataset.goch)state.chapterId=el.dataset.goch;else{var f3=fileOf(state.courseId,state.fileId);if(f3&&f3.chapters.length)state.chapterId=f3.chapters[0].id;}state.view="read";render();return;}
 if((el=e.target.closest("[data-gosim]"))){state.simId=el.dataset.gosim;state.view="sim";closeSide();render();return;}
 if((el=e.target.closest("[data-nav]"))){var t=el.dataset.nav;state.view=(t==="read")?"read":t;closeSide();render();return;}
 if((el=e.target.closest("[data-course]"))){state.courseId=el.dataset.course;var f4=course().files[0];if(f4){state.fileId=f4.id;state.chapterId=f4.chapters[0].id;state.openFiles[f4.id]=true;state.view="read";}closeSide();render();return;}
 if(!e.target.closest(".search")){var sr=$("#sres");if(sr)sr.classList.remove("on");}});
function closeSide(){var s=$("#side"),c=$("#scrim");if(s)s.classList.remove("open");if(c)c.classList.remove("on");}
$("#scrim").onclick=closeSide;
window.addEventListener("scroll",function(){var h=document.documentElement,max=h.scrollHeight-h.clientHeight;$("#progline").style.width=(max>0?(h.scrollTop/max*100):0)+"%";$("#totop").classList.toggle("on",h.scrollTop>520);});
try{var th=localStorage.getItem("radlib_theme");if(th)document.documentElement.dataset.theme=th;
 var fs=parseFloat(localStorage.getItem("radlib_fs"));if(fs&&isFinite(fs)){state.fs=fs;document.documentElement.style.setProperty("--fs",fs);}}catch(e){}

function applyUrlHash(){
  var raw=(window.location.hash||"").replace(/^#/,"").trim();
  if(!raw)return;
  if(raw==="home"||raw==="root"){state.view="home";}
  else if(raw==="rt2568"||raw==="quantities"||raw==="unit"){
    state.courseId="rt2568";state.fileId="sum-md";state.chapterId="ch1";state.openFiles["sum-md"]=true;state.view="read";
  }
  else if(raw==="rt2569"||raw==="radioactivity"||raw==="decay"){
    state.courseId="rt2569";state.fileId="rad-md";state.chapterId="r1";state.openFiles["rad-md"]=true;state.view="read";
  }
  else if(raw==="sims"||raw==="simulators"){state.view="sims";}
  else if(raw==="quiz"||raw==="exam"){state.view="quiz";}
  else if(raw==="formulas"||raw==="formula"){state.view="formulas";}
  else if(raw.indexOf("ch")===0){
    state.courseId="rt2568";state.fileId="sum-md";state.chapterId=raw;state.openFiles["sum-md"]=true;state.view="read";
  }
  else if(raw.indexOf("r")===0){
    state.courseId="rt2569";state.fileId="rad-md";state.chapterId=raw;state.openFiles["rad-md"]=true;state.view="read";
  }
  else if(SIMS[raw]){state.simId=raw;state.view="sim";}
}
applyUrlHash();
window.addEventListener("hashchange",function(){applyUrlHash();render();});
render();
</script>
